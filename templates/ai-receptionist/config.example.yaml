# Copy to clients/<slug>/receptionist/config.yaml and fill in. No passwords or API keys here.
business:
  name: Willow & Rose
  industry: salon
  address: 1 Example Street, London
  website: https://example.com
  timezone: Europe/London
hours:
  monday: closed
  tuesday: "09:00-19:00"
  wednesday: "09:00-19:00"
  thursday: "09:00-19:00"
  friday: "09:00-19:00"
  saturday: "09:00-17:00"
  sunday: closed
receptionist:
  name: Ellie                # spoken name; it still says it is an AI assistant when asked
  voice: warm, British, unhurried
  greeting: "Thanks for calling Willow and Rose, this is Ellie, the studio's AI assistant. How can I help?"
  recording_notice: "Calls are recorded so we can look after you properly."
booking:
  calendar: Google Calendar (test calendar until go-live)
  services_bookable: [Cut and finish, Blow-dry]
  services_message_only: [Full colour, Balayage]   # need a consultation or patch test
  min_notice_hours: 2
transfer:
  number_ref: "1Password: Client - Willow & Rose / Owner mobile"   # reference only
  when: [complaint, emergency, caller asks for a person twice, supplier or sales call for the owner]
  out_of_hours: take_message
messages:
  send_summaries_to: owner@example.com
  urgent_sms_to_ref: "1Password: Client - Willow & Rose / Owner mobile"
limits:
  quote_prices: only_from_knowledge_base
  never: [medical advice, legal advice, financial advice, promises of results, discounts]
